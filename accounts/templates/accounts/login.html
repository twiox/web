{% extends "members/base.html" %}
{% block content %}
<section style="text-align:center;">
    <h1>Login</h1>
    <form class="form_wrapper" method="POST">
        {% csrf_token %}
        <div class ="inner_form padding_all_big flex_center chair_col-5">
            {% for error in form.non_field_errors %}
                <p class="padding_tb_small" style="color:red;">{{ error }}</p>
            {% endfor %}
            {% for field in form %}
                {% include "accounts/snippets/field.html" %}
            {% endfor %}
            <button class="form_button padding_all_small" style="margin:20px auto;" type="submit">
                <span >OK</span>
            </button>
        </div>
    </form>
    <a href="{% url 'password_reset' %}" class="more_info_button padding_all_small flex_center">Passwort zurücksetzen</a>
    <script>
        const fields = document.querySelectorAll('.mdc-text-field');
        fields.forEach(field => mdc.textField.MDCTextField.attachTo(field));
    </script>
</section>
{% endblock %}
