<ul class="chip_list">
    {% for trainer in object_list %}
    <li class="person_chip">
        {{ trainer.user.first_name }} {{ trainer.user.last_name }}
        {% if not session.payed %}
        <button type="button" title="Entfernen"
                hx-post="{% url 'trainingsession_del_trainer' session.pk %}?type={{ type }}"
                hx-vals='{"trainer_pk":"{{ trainer.pk }}"}'
                hx-target="#{{ type }}-list"><i class="far fa-minus-square"></i></button>
        {% endif %}
    </li>
    {% empty %}
    <li class="chip_empty">Niemand eingetragen</li>
    {% endfor %}
</ul>
{% if not session.payed %}
<form hx-get="{% url 'trainingsession_search' session.pk %}?type={{ type }}"
      hx-target="#{{ type }}-search-results"
      hx-trigger="input changed delay:250ms">
    <label class="mdc-text-field mdc-text-field--filled">
        <span class="mdc-text-field__ripple"></span>
        <input type="text" class="mdc-text-field__input" name="query" aria-labelledby="{{ type }}-query-label" autocomplete="off">
        <span class="mdc-floating-label" id="{{ type }}-query-label">{% if type == 'cotrainer' %}Co-Trainer*in{% else %}Trainer*in{% endif %} suchen</span>
        <span class="mdc-line-ripple"></span>
    </label>
</form>
<div id="{{ type }}-search-results"></div>
{% endif %}
