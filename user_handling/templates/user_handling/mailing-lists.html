{% extends "members/base.html" %}
{% block content %}
<section>
    <h1>Mailverteiler</h1>
    <p>Kopiert alle Emails und Zusatzemails in die Zwischenablage.</p>
    <div style='display:flex;flex-direction:column;'>
        <div id='alle' class='mail_click padding_all_small tertiary_bg prim_hover' style='cursor:pointer'>Alle Mitglieder (inkl. Trainermails)</div>
        <span style='height:15px;'> </span>
        {% for stat_id,status in user.profile.choices %}
            <div id='email_{{stat_id}}' class='mail_click padding_all_small tertiary_bg prim_hover' style='cursor:pointer'>Status: {{status}}</div>
            <span style='height:15px;'> </span>
        {% endfor %}
    </div>
</section>
<script>
    $('.mail_click').on('click', function(){
        $.ajax({
            data: {'id': $(this).attr("id")},
            url: '{% url "get_all_emails" %}',
            type: 'GET',
            success: function (data){
                navigator.clipboard.writeText(data['string']);
                snackbar.labelText = "In die Zwischenablage kopiert";
                snackbar.open();
            }
        });
    });
</script>
{% endblock %}
